---
security:
  - |
    Prohibit object copies via PUT tempurls. Previously, an attacker with a
    PUT tempurl could copy arbitrary data from within the same container
    (or, if the tempurl was signed using an account key, anywhere within the
    same account) provided they know the object path, then read back the
    object's metadata via a HEAD using the same signature. Refer to
    `CVE-2026-97149 <https://www.cve.org/CVERecord?id=CVE-2026-97149>`__
    for more information. This was first fixed in Swift 2.38.2.

fixes:
  - |
    Fix how s3api copies multipart uploads, both for ``CopyObject`` and
    ``UploadPartCopy`` operations. Previously, these would fail with a
    ``412 Precondition Failed`` response if the client included a
    ``x-amz-copy-source-if-match`` header. Recent AWS clients began including
    this header by default for copy operations.
